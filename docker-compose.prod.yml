version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ler_o_brasil_db
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ler_o_brasil}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ler_o_brasil_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ler_o_brasil_web
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=ler_o_brasil.settings.production
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${DATABASE_NAME:-ler_o_brasil}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ler_o_brasil_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ler_o_brasil_network:
    driver: bridge
