version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ler_o_brasil_db_dev
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ler_o_brasil}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ler_o_brasil_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ler_o_brasil_web_dev
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=ler_o_brasil.settings.dev
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${DATABASE_NAME:-ler_o_brasil}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ler_o_brasil_network

volumes:
  postgres_data_dev:
    driver: local

networks:
  ler_o_brasil_network:
    driver: bridge
